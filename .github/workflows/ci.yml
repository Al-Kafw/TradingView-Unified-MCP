name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run audit:source
      - run: npm run audit:release
      - run: npm test
      - run: npm run test:security
      - run: npm run catalog
      - run: git diff --exit-code -- docs/TOOLS.json docs/FEATURES.md docs/CATALOG_COUNTS.json
